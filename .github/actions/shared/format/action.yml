name: "shared-format"
description: "Provide a shared workflow for code formatting"
inputs:
  manifest_path:
    description: ""
    required: false
runs:
  using: "composite"
  steps:
    # we use nightly to get access to advanced format capabilities
    - name: Setup Rust
      uses: "./.github/actions/shared/rust/rust-setup"
      with:
        toolchain: nightly
        os: ${{ runner.os }}
        job: ${{ github.job }}
        components: rustfmt

    - name: Install cargo-license-template
      shell: bash
      run: cargo install cargo-license-template

    - name: Install dprint
      shell: bash
      run: npm install -g dprint

    - name: core fmt check
      shell: bash
      run: cargo +nightly fmt --all -- --check

    - name: wasm fmt
      shell: bash
      run: cargo +nightly fmt --manifest-path ${{ inputs.manifest_path }} --all -- --check

    - name: Cargo.toml fmt check
      shell: bash
      run: dprint check

    - name: cargo-license-template check
      shell: bash
      run: cargo +nightly license-template --template .license_template --ignore .license_template_ignore --verbose

